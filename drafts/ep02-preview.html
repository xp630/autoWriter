<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>EP02</title><style>body{margin:0;padding:28px 22px 80px;background:#f8fafb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:17px;line-height:1.85;max-width:720px;margin:0 auto;}p{margin:0 0 1.2em;}h1,h2{font-weight:800;line-height:1.45;margin:1.4em 0 .6em;}.qp-h1{font-size:26px;color:#047857;}.qp-h2{font-size:22px;border-left:4px solid #10b981;padding-left:12px;color:#047857;}.qp-viewpoint{background:#ecfdf5;border-left:4px solid #10b981;padding:14px 18px;margin:1.2em 0;border-radius:4px;font-weight:500;}.qp-quote{border-left:4px solid #c8d9d3;padding:8px 16px;margin:1.2em 0;color:#374151;font-style:italic;background:#f1f5f4;}strong{font-weight:700;color:#059669;}</style></head><body><h1 class="qp-h1">我以为自己没有观点</h1>
<blockquote class="qp-quote">我以为自己没有观点。<br/>&gt; 后来发现，观点一直都在，只是藏在观察后面。</blockquote>
<div class="qp-viewpoint"><strong>观察背后，藏着你所有的观点。</strong></div>
<p>有个陌生人点赞。</p>
<div class="qp-viewpoint"><strong>有人点了赞。不是朋友。不是家人。是一个陌生人。</strong></div>
<p>因为我不知道他是不是真的产生了共鸣。</p>
<p>为什么在意共鸣？</p>
<div class="qp-viewpoint"><strong>因为我想知道，有没有人真的在认真看。</strong></div>
<div class="qp-viewpoint">观察背后，藏着你所有的观点。</div>
<p>## 我以为的过程</p>
<p>以前我以为创作是：观点 → 文章。</p>
<p>现在我觉得更像：观察 → 疑问 → 观点 → 文章。</p>
<p>观察是一颗种子。疑问是发芽。观点是长出来的树。文章只是最后结出的果实。</p></body></html>
