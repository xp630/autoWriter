<p>从公开信息看，景甜与孙宇晨几乎没有正式交集。</p>
<div class="qp-viewpoint"><strong>流量能买到热搜位，但买不到信任银行的席位。</strong></div>
<h2 class="qp-h2">炒作型"科技企业家"的流量飞轮</h2>
<p>拆解孙宇晨的公开营销剧本，是三件套：名人绑定、天价事件、争议变现。</p>
<div class="qp-viewpoint">炒作型创始人的核心竞争力不是技术，而是"让你记住他"。</div>
<h2 class="qp-h2">名人"信用出借"</h2>
<p>信任是可以挂牌转让的，但定价是错的。</p>
<p>科技圈的信任转让市场里，收溢价的永远是最后接盘的人。</p>
